function cell(col,row){var r=SEED[row%SEED.length]||{};return r[col.n]!==undefined?r[col.n]:""}
function seedRow(no,ri){

var DW=820, scale=1;
function layout(){

function apply(n){
 cur=n;

 var act=STEPS[n].act;

 // 横向滚动把整组关注列带进视野。⚠ 锚点必须取「物理最靠右」的列，

 var ml=0,maxR=-1;
 (STEPS[n].focus||[]).concat(act?[act]:[]).forEach(function(f){

 if(maxR>0){var gw=document.querySelector(".grid").clientWidth;
