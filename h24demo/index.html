function seedRow(no,ri){

 var tds=COLS.map(function(c){return '<div class="td" data-col="'+c.f+'" style="width:'+c.w+'px">'+cell(c,ri)+"</div>"});
 return '<div class="rrow"><div class="rn"><span class="cb"></span>'+no+"</div>"+tds.join("")+"</div>"}
var DW=820, scale=1;
function layout(){

function apply(n){
 cur=n;
 document.querySelectorAll(".td[id]").forEach(function(e){e.innerHTML="";e.classList.remove("act")});
 for(var k in BASE){var e=S("a_"+k);if(e)e.innerHTML=BASE[k]}

 for(var c2 in merged){var e2=S("b_"+c2);if(e2)e2.innerHTML=merged[c2]}

 var ml=0,maxR=-1;
 (STEPS[n].focus||[]).concat(act?[act]:[]).forEach(function(f){

 if(maxR>0){var gw=document.querySelector(".grid").clientWidth;
  ml=-Math.max(0,maxR+10-gw)}

 S("r1").className="rrow"+(done?" done":"");
 S("note").className="note"+(note?" show":"");
 S("cap").innerHTML=STEPS[n].cap;S("sub").textContent=STEPS[n].sub;
 document.querySelectorAll(".pill[data-s]").forEach(function(p){

// 尺寸自适应三重保险：resize 事件 / ResizeObserver / 心跳兜底

var rto,lastW=0,lastH=0;
