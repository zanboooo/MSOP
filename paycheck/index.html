<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>付款申请 · 提交自查</title>
<style>
/* 两条铁律：① 背景一律透明 ② 按 820 基准等比缩放。暗色兜底写在 transparent 之后。 */
html,body{background:transparent}
@media (prefers-color-scheme:dark){html,body{background:#1a1a1a}}
:root{--ink:#8a9099;--ink2:#6f757e;--line:rgba(138,144,153,.34);--line2:rgba(138,144,153,.18);
 --b1:#e4007f;--b2:#6d3b85;--ok:#2f9e5a;--gut:28px;--unit:8px;--r:9px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 "PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;color:var(--ink);overflow:hidden}
#stage{width:820px;transform-origin:top left;padding:16px var(--gut) 8px}
h1{font-size:16px;font-weight:700;color:var(--ink2)}
.sub{font-size:12px;opacity:.85;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.g{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.g h2{font-size:13px;color:var(--ink2);margin-bottom:6px;display:flex;justify-content:space-between}
.g h2 i{font-style:normal;font-size:11.5px;font-family:ui-monospace,monospace;opacity:.8}
.g label{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.5;padding:4px 0;cursor:pointer;
 border-top:1px solid var(--line2)}
.g label:first-of-type{border-top:0}
.g input{margin-top:4px;accent-color:var(--b2);flex:0 0 auto}
.g label.d{color:var(--ink2);text-decoration:line-through;opacity:.7}
.verdict{border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;gap:14px;
 margin-bottom:20px;transition:border-color .3s}
.verdict b{font-size:18px;color:var(--ink2);transition:color .3s;white-space:nowrap}
.verdict.ok{border-color:var(--ok)} .verdict.ok b{color:var(--ok)}
.verdict .bar{flex:1;height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.verdict .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b1),var(--b2));transition:width .35s}
.verdict small{font-size:12px;opacity:.85;white-space:nowrap}
h1.s2{font-size:14px;margin-bottom:8px}
.cases{display:flex;gap:12px;align-items:stretch}
.cl{flex:0 0 300px;display:flex;flex-direction:column;gap:6px}
.cl button{text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:transparent;
 color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer;line-height:1.45;transition:border-color .2s,color .2s}
.cl button:hover{border-color:var(--b2)}
.cl button.on{border-color:var(--b2);color:var(--ink2);font-weight:600;box-shadow:inset 3px 0 0 var(--b2)}
.ans{flex:1;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;font-size:13px;line-height:1.7;color:var(--ink)}
.ans b{color:var(--b1);font-weight:600}
.ans .t{font-size:12px;color:var(--ink2);margin-bottom:4px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="stage">
<h1 id="h1"></h1>
<div class="sub" id="sub"></div>
<div class="grid" id="grid"></div>
<div class="verdict" id="v"><b id="vt"></b><div class="bar"><i id="vb"></i></div><small id="vs"></small></div>
<h1 class="s2" id="h2"></h1>
<div class="cases">
 <div class="cl" id="cl"></div>
 <div class="ans"><div class="t" id="at"></div><div id="ab"></div></div>
</div>
</div>
<script>
var T = {"zh":{"h1":null,"sub":"资料不全不提交 —— 退回一次，付款就晚一天。","left":null,"ok":"可以提交","hint":"全勾完才提交","go":"去 Lark › 审批 › 付款申请 发起","h2":"被退回或拒绝了，怎么走","groups":[["申请信息",["付款类型、费用归属都选对了","付款用途写清「买什么、为什么付」","币种、金额、期望付款日期填了"]],["收款信息",["收款对象、户名与银行账户一致","银行或支付平台、账号／VA 复制粘贴后再核过","新收款账户已向财务说明来源"]],["申请依据",["合同、账单、报价单或报销明细已附上","一笔付款只对应这一份申请，没有合并无关事项","没有把同一事项拆成几张单"]]],"cases":[["资料缺了，但能补上","审批人选<b>退回</b>并写明缺哪一项。你补齐后，同一张单继续走，不用重新发起。"],["金额、币种、收款账户或付款对象变了","不能在原单上改着付。改完<b>重新发起完整审批</b>，从第一站再走一遍。"],["被判定重复申请、虚假资料或不合理支出","审批人选<b>拒绝</b>并写明原因，原单作废。有异议找当前节点负责人，不要另开一张绕过去。"],["审批卡在某个节点，长时间没人动","联系<b>当前节点负责人</b>。不得绕过审批直接催付款。"],["急着付，等不及走完流程","紧急付款也必须走审批。确需先处理，由<b>最高审批人书面说明</b>，并在<b>当天</b>补齐流程。"]]},"id":{"h1":null,"sub":"Data tidak lengkap jangan diajukan — sekali dikembalikan, pembayaran mundur sehari.","left":null,"ok":"Siap diajukan","hint":"Ajukan setelah semua dicentang","go":"Buka Lark › Approval › Payment Request","h2":"Dikembalikan atau ditolak, lalu bagaimana","groups":[["Data permohonan",["Jenis pembayaran dan alokasi biaya sudah benar","Tujuan bayar jelas: beli apa, kenapa dibayar","Mata uang, nominal, tanggal bayar terisi"]],["Data penerima",["Penerima, nama rekening, dan bank cocok","Bank/platform dan nomor rekening/VA disalin lalu dicek ulang","Rekening baru sudah dijelaskan ke Finance"]],["Dasar permohonan",["Kontrak, tagihan, penawaran, atau rincian klaim dilampirkan","Satu pembayaran satu permohonan, tidak digabung","Tidak memecah satu urusan jadi beberapa permohonan"]]],"cases":[["Data kurang, tapi bisa dilengkapi","Penyetuju memilih <b>kembalikan</b> dan menulis apa yang kurang. Setelah dilengkapi, permohonan yang sama lanjut, tidak perlu ajukan ulang."],["Nominal, mata uang, rekening, atau penerima berubah","Tidak boleh dibayar dari permohonan lama. Ubah lalu <b>ajukan ulang dari awal</b>."],["Dinilai ganda, data palsu, atau pengeluaran tidak wajar","Penyetuju memilih <b>tolak</b> dan menulis alasan; permohonan batal. Keberatan? Hubungi penanggung jawab node, jangan buat permohonan baru untuk menghindar."],["Permohonan tertahan lama di satu node","Hubungi <b>penanggung jawab node saat ini</b>. Dilarang melewati approval dan langsung menagih pembayaran."],["Mendesak, tidak sempat menunggu alur selesai","Pembayaran mendesak tetap lewat approval. Jika terpaksa lebih dulu, <b>penyetuju tertinggi menulis keterangan</b> dan alur dilengkapi <b>hari itu juga</b>."]]}};
var F = { zh: { h1: function (n) { return "发起前把这 " + n + " 项勾完"; }, left: function (n) { return "还差 " + n + " 项"; } },
          id: { h1: function (n) { return "Centang " + n + " hal ini sebelum mengajukan"; }, left: function (n) { return "Kurang " + n + " hal"; } } };
var L = (new URLSearchParams(location.search).get("lang") || "zh"); if (!T[L]) L = "zh";
document.documentElement.lang = L === "id" ? "id" : "zh-CN";
var t = T[L], f = F[L], N = 0; t.groups.forEach(function (g) { N += g[1].length; });
document.title = L === "id" ? "Payment Request · Cek Mandiri" : "付款申请 · 提交自查";
document.getElementById("h1").textContent = f.h1(N);
document.getElementById("sub").textContent = t.sub;
document.getElementById("h2").textContent = t.h2;
document.getElementById("grid").innerHTML = t.groups.map(function (g, gi) {
  return '<div class="g"><h2>' + g[0] + '<i id="c' + gi + '">0/' + g[1].length + '</i></h2>' +
    g[1].map(function (x) { return '<label><input type="checkbox" data-g="' + gi + '"><span>' + x + '</span></label>'; }).join("") + '</div>';
}).join("");
document.getElementById("cl").innerHTML = t.cases.map(function (c, i) { return '<button data-i="' + i + '">' + c[0] + '</button>'; }).join("");
var boxes = [].slice.call(document.querySelectorAll("input[type=checkbox]"));
function tally() {
  var per = [0, 0, 0], done = 0;
  boxes.forEach(function (b) { b.parentNode.classList.toggle("d", b.checked); if (b.checked) { done++; per[+b.dataset.g]++; } });
  t.groups.forEach(function (g, gi) { document.getElementById("c" + gi).textContent = per[gi] + "/" + g[1].length; });
  var left = N - done, v = document.getElementById("v");
  document.getElementById("vb").style.width = (done / N * 100) + "%";
  v.classList.toggle("ok", left === 0);
  document.getElementById("vt").textContent = left === 0 ? t.ok : f.left(left);
  document.getElementById("vs").textContent = left === 0 ? t.go : t.hint;
}
boxes.forEach(function (b) { b.addEventListener("change", tally); });
function pick(i) {
  [].slice.call(document.querySelectorAll("#cl button")).forEach(function (b, j) { b.classList.toggle("on", i === j); });
  document.getElementById("at").textContent = t.cases[i][0];
  document.getElementById("ab").innerHTML = t.cases[i][1];
}
document.getElementById("cl").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) pick(+b.dataset.i); });
pick(0); tally();
// 等比缩放到 820 基准；transform 不改布局高度，写回 body
var st = document.getElementById("stage");
function fit() { var s = Math.min(1, document.documentElement.clientWidth / 820);
  st.style.transform = s < 1 ? "scale(" + s + ")" : "none"; document.body.style.height = Math.ceil(st.offsetHeight * s) + "px"; }
addEventListener("resize", fit); if (window.ResizeObserver) new ResizeObserver(fit).observe(document.body); setInterval(fit, 1200); fit();
</script></body></html>
