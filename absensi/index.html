<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>考勤结果试算</title>
<style>
html,body{background:transparent}
@media (prefers-color-scheme:dark){html,body{background:#1a1a1a}}
:root{--ink:#8a9099;--ink2:#6f757e;--line:rgba(138,144,153,.34);--line2:rgba(138,144,153,.18);--b1:#e4007f;--b2:#6d3b85;--ok:#2f9e5a;--gut:28px;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 "PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;color:var(--ink);overflow:hidden}
#stage{width:820px;transform-origin:top left;padding:16px var(--gut) 8px}
h1{font-size:17px;font-weight:700;color:var(--ink2)}
.sub{font-size:12px;opacity:.85;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.f{flex:1;min-width:130px}
label{display:block;font-size:12px;color:var(--ink);margin-bottom:5px;height:18px;white-space:nowrap;overflow:hidden}
input,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:15px;font-weight:600;background:transparent;color:var(--ink2);font-family:inherit;transition:border-color .25s}
input:focus,select:focus{outline:none;border-color:var(--b2)}
.rem{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rem .nm{font-size:12.5px;color:var(--ink)}
.chip{border:1px solid var(--line);border-radius:20px;padding:4px 14px;background:transparent;color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer;transition:all .2s}
.chip.on{border-color:var(--ok);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.chip:disabled{opacity:.35;cursor:default}
.rem .hint{font-size:12px;color:var(--ink);margin-left:auto}
.pool{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pool .nm{font-size:12.5px;color:var(--ink)}
.pool b{font-size:22px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.pool .track{flex:1;min-width:160px;height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.pool .track i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--ok),var(--b2));transition:width .35s ease}
.pool.over .track i{background:linear-gradient(90deg,var(--b2),var(--b1))}
.pool .st{font-size:12.5px;color:var(--ok);font-weight:600}
.pool.over .st{color:var(--b1)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.c{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;transition:border-color .3s}
.c .t{font-size:12px;color:var(--ink);margin-bottom:4px}
.c .v{font-size:20px;font-weight:700;color:var(--ok)}
.c.bad .v{color:var(--b1)}
.c.bad{border-color:var(--b1)}
.c ul{margin-top:6px;padding-left:16px;font-size:12px;line-height:1.55;color:var(--ink)}
.formula{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 9px;display:inline-block;margin-bottom:10px}
.note{font-size:11.5px;color:var(--ink);opacity:.85;line-height:1.7}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="stage">
<h1 id="h1"></h1><div class="sub" id="sub"></div>
<div class="row">
  <div class="f"><label id="l1"></label><input id="late" type="number" inputmode="numeric" value="1" min="0"></div>
  <div class="f"><label id="l2"></label><input id="missed" type="number" inputmode="numeric" value="1" min="0"></div>
  <div class="f"><label id="l3"></label><input id="absent" type="number" inputmode="numeric" value="0" min="0"></div>
  <div class="f"><label id="l4"></label><input id="izin" type="number" inputmode="numeric" value="0" min="0"></div>
  <div class="f"><label id="l5"></label><select id="noproof"><option value="0"></option><option value="1"></option></select></div>
</div>
<div class="rem"><span class="nm" id="rnm"></span><button class="chip" data-i="1"></button><button class="chip" data-i="2"></button><button class="chip" data-i="3"></button><span class="hint" id="rhint"></span></div>
<div class="pool" id="pool"><span class="nm" id="pnm"></span><b id="pn">0</b><span class="track"><i id="pi"></i></span><span class="st" id="pst"></span></div>
<div class="grid">
  <div class="c" id="c1"><div class="t" id="t1"></div><div class="v" id="v1"></div><ul id="u1"></ul></div>
  <div class="c" id="c2"><div class="t" id="t2"></div><div class="v" id="v2"></div><ul id="u2"></ul></div>
  <div class="c" id="c3"><div class="t" id="t3"></div><div class="v" id="v3"></div><ul id="u3"></ul></div>
</div>
<span class="formula" id="fm"></span>
<div class="note" id="notes"></div>
</div>
<script>
var T = {"zh":{"title":"考勤结果试算","sub":"填本月的数字，看满勤奖还在不在、会不会记警告。迟到和缺卡不扣基本工资。","late":"迟到次数","missed":"缺卡次数","absent":"旷工天数","izin":"事假小时","noproof":"无证明病假","remedyT":"补卡机会（每月 3 次，3 天内提）","remedyChip":"补卡","remedyUsed":null,"remedyNone":"点亮已通过的补卡，通过的不计入缺卡","yes":"有","no":"无","pool":"迟到 + 缺卡合计","poolFree":"不超过 2 次不影响","poolOver":"超过 2 次","bonusT":"满勤奖","keep":"保留","zero":"归零","rBonusPool":"迟到＋缺卡合计超过 2 次","rBonusAbsent":"有旷工","rBonusIzin":"有事假","rBonusSick":"有无证明病假","rBonusOK":"本月出勤干净","spT":"警告（SP）","spNone":"不记","spPool":"考勤类 1 张：合计超过 2 次，一月只开一张","spAbsent":null,"payT":"工资影响","payNone":"基本工资不受影响","payAbsent":null,"payIzin":null,"payNote":"迟到、缺卡不扣基本工资","formula":"事假扣款 = 月薪 ÷ 173 × 小时　｜　旷工 = 当天不计薪","notes":["缺卡按次：上班卡、下班卡各算一次；3 天内可提补卡，每月最多 3 次，通过后不计。迟到、早退不能补。","SP 三级：SP1 → SP2 → SP3，同类问题 6 个月内再犯升一级；SP3 有效期内再犯，解除合同。","连续 5 个工作日没打卡也没请假，且两次传唤不回，按自愿离职处理。"],"sp":["","SP1","SP2","SP3"]},"id":{"title":"Simulasi hasil absensi","sub":"Isi angka bulan ini: uang kerajinan masih ada atau tidak, dapat SP atau tidak. Telat dan lupa absen tidak memotong gaji pokok.","late":"Terlambat","missed":"Lupa absen","absent":"Mangkir","izin":"Jam izin","noproof":"Sakit tanpa surat","remedyT":"Kesempatan koreksi (3x sebulan, dalam 3 hari)","remedyChip":"Koreksi","remedyUsed":null,"remedyNone":"Nyalakan koreksi yang disetujui; yang disetujui tidak dihitung","yes":"Ada","no":"Tidak","pool":"Terlambat + lupa absen","poolFree":"sampai 2 kali tidak apa-apa","poolOver":"lebih dari 2 kali","bonusT":"Uang kerajinan","keep":"Tetap dapat","zero":"Hangus","rBonusPool":"terlambat + lupa absen lebih dari 2 kali","rBonusAbsent":"ada mangkir","rBonusIzin":"ada izin pribadi","rBonusSick":"ada sakit tanpa surat","rBonusOK":"absensi bulan ini bersih","spT":"Surat peringatan (SP)","spNone":"Tidak ada","spPool":"1 SP absensi: lebih dari 2 kali, hanya 1 per bulan","spAbsent":null,"payT":"Pengaruh ke gaji","payNone":"Gaji pokok tidak terpengaruh","payAbsent":null,"payIzin":null,"payNote":"Telat dan lupa absen tidak memotong gaji pokok","formula":"potongan izin = gaji ÷ 173 × jam　｜　mangkir = hari itu tidak digaji","notes":["Lupa absen dihitung per kali: absen masuk dan pulang masing-masing satu; koreksi dalam 3 hari, maksimal 3 kali sebulan, disetujui tidak dihitung. Telat dan pulang cepat tidak bisa dikoreksi.","SP tiga tingkat: SP1 → SP2 → SP3, terulang dalam 6 bulan naik satu tingkat; melanggar lagi saat SP3 berlaku, kontrak diakhiri.","5 hari kerja berturut-turut tidak absen dan tidak izin, lalu 2 kali dipanggil tidak menjawab, dianggap mengundurkan diri."],"sp":["","SP1","SP2","SP3"]}};
var FN = { zh: { remedyUsed: function (u, m) { return "已用 " + u + " 次 → 计入缺卡 " + m + " 次"; }, spAbsent: function (d, l) { return "旷工 " + d + " 天 → " + l; }, payAbsent: function (d) { return "旷工 " + d + " 天不计薪"; }, payIzin: function (h) { return "事假 " + h + " 小时按小时扣"; } },
           id: { remedyUsed: function (u, m) { return "Dipakai " + u + "x → dihitung lupa absen " + m + "x"; }, spAbsent: function (d, l) { return "Mangkir " + d + " hari → " + l; }, payAbsent: function (d) { return "Mangkir " + d + " hari tidak digaji"; }, payIzin: function (h) { return "Izin " + h + " jam dipotong per jam"; } } };
var L = (new URLSearchParams(location.search).get("lang") || "zh"); if (!T[L]) L = "zh";
document.documentElement.lang = L === "id" ? "id" : "zh-CN"; var t = T[L], fn = FN[L];
var $ = function (id) { return document.getElementById(id); };
document.title = t.title; $("h1").textContent = t.title; $("sub").textContent = t.sub;
$("l1").textContent = t.late; $("l2").textContent = t.missed; $("l3").textContent = t.absent; $("l4").textContent = t.izin; $("l5").textContent = t.noproof;
$("noproof").options[0].textContent = t.no; $("noproof").options[1].textContent = t.yes;
$("pnm").textContent = t.pool; $("rnm").textContent = t.remedyT; var chips = [].slice.call(document.querySelectorAll(".chip")); chips.forEach(function (c) { c.textContent = t.remedyChip + " " + c.dataset.i; c.addEventListener("click", function () { var n = +c.dataset.i; used = (used === n) ? n - 1 : n; calc(); }); }); var used = 0; $("t1").textContent = t.bonusT; $("t2").textContent = t.spT; $("t3").textContent = t.payT;
$("fm").textContent = t.formula; $("notes").innerHTML = t.notes.map(function (s) { return "• " + s; }).join("<br>");
var FREE = 2;   // 合池免扣次数（T01「迟到＋缺卡免扣次数」）
function num(id) { return Math.max(0, Math.floor(parseFloat($(id).value) || 0)); }
function li(el, arr) { el.innerHTML = arr.map(function (s) { return "<li>" + s + "</li>"; }).join(""); }
function calc() {
  var late = num("late"), raw = num("missed"), absent = num("absent"), izin = num("izin"), noproof = $("noproof").value === "1";
  if (used > raw) used = raw; chips.forEach(function (c) { var n = +c.dataset.i; c.className = "chip" + (n <= used ? " on" : ""); c.disabled = n > raw; });
  var missed = Math.max(0, raw - used); $("rhint").textContent = used ? fn.remedyUsed(used, missed) : t.remedyNone;
  var pool = late + missed, over = pool > FREE;
  $("pn").textContent = pool; $("pi").style.width = Math.min(100, pool / (FREE + 2) * 100) + "%";
  $("pool").className = "pool" + (over ? " over" : ""); $("pst").textContent = over ? t.poolOver : t.poolFree;
  // 满勤奖
  var why = []; if (over) why.push(t.rBonusPool); if (absent) why.push(t.rBonusAbsent); if (izin) why.push(t.rBonusIzin); if (noproof) why.push(t.rBonusSick);
  var zero = why.length > 0; $("c1").className = "c" + (zero ? " bad" : ""); $("v1").textContent = zero ? t.zero : t.keep; li($("u1"), zero ? why : [t.rBonusOK]);
  // SP
  var sp = []; if (over) sp.push(t.spPool); if (absent) sp.push(fn.spAbsent(absent, t.sp[Math.min(3, absent)]));
  $("c2").className = "c" + (sp.length ? " bad" : ""); $("v2").textContent = sp.length ? sp.length : t.spNone; li($("u2"), sp.length ? sp : []);
  // 工资
  var pay = []; if (absent) pay.push(fn.payAbsent(absent)); if (izin) pay.push(fn.payIzin(izin));
  $("c3").className = "c" + (pay.length ? " bad" : ""); $("v3").textContent = pay.length ? pay.length : t.payNone; li($("u3"), pay.concat([t.payNote]));
  if (!pay.length) $("v3").style.fontSize = "15px"; else $("v3").style.fontSize = "";
  if (!sp.length) $("v2").style.fontSize = "15px"; else $("v2").style.fontSize = "";
}
["late", "missed", "absent", "izin"].forEach(function (k) { $(k).addEventListener("input", calc); }); $("noproof").addEventListener("change", calc);
calc();
var st = $("stage");
function fit() { var s = Math.min(1, document.documentElement.clientWidth / 820); st.style.transform = s < 1 ? "scale(" + s + ")" : "none"; document.body.style.height = Math.ceil(st.offsetHeight * s) + "px"; }
addEventListener("resize", fit); if (window.ResizeObserver) new ResizeObserver(fit).observe(document.body); setInterval(fit, 1200); fit();
</script></body></html>
