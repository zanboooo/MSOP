<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>请假与补卡 · 流程总览</title>
<!-- built by tools/demo/shell.js —— 版面与步骤栏由外壳锁定，勿手改本文件 -->
<style>
/* 两条铁律：① 背景一律透明（暗色下白块突兀）② 按 820 基准等比缩放。
   ⚠ 暗色兜底必须写在 transparent 之后，同特异性后者胜。配色全中间调，白底黑底通吃。 */
html,body{background:transparent}
@media (prefers-color-scheme:dark){html,body{background:#1a1a1a}}

:root{
  --ink:#8a9099; --ink2:#6f757e;
  --line:rgba(138,144,153,.34); --line2:rgba(138,144,153,.18);
  --b1:#e4007f; --b2:#6d3b85; --b3:#1d2088;
  --gut:28px; --unit:8px; --r:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 "PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;
 color:var(--ink);overflow:hidden}

/* 版面：左右 gutter 是硬规矩，内容永远不贴边 */
#stage{width:820px;transform-origin:top left;padding:calc(var(--unit)*2) var(--gut) var(--unit)}

.hd{margin-bottom:calc(var(--unit)*2)}
.hd h1{font-size:16px;font-weight:700;color:var(--ink2);letter-spacing:-.01em}
.hd .sub{font-size:12px;opacity:.85;margin-top:2px}

/* ── 步骤栏：全站唯一一套 ── */
.bar{display:flex;align-items:center;gap:var(--unit);flex-wrap:wrap;
 margin-bottom:calc(var(--unit)*2)}
.pill{border:1px solid var(--line);border-radius:14px;padding:4px 13px;font-size:12.5px;
 color:var(--ink);cursor:pointer;user-select:none;background:transparent;white-space:nowrap;
 transition:border-color .2s,color .2s}
.pill:hover{border-color:var(--b2)}
.pill.on{border-color:var(--b2);color:var(--ink2);font-weight:700}
.pill.play{font-family:ui-monospace,monospace;min-width:36px;text-align:center}
.pill:focus-visible{outline:2px solid var(--b2);outline-offset:2px}

/* ── 底部说明条 ── */
.cap{margin-top:calc(var(--unit)*2);border-top:1px solid var(--line);
 padding-top:calc(var(--unit)*1.5);display:flex;align-items:flex-start;gap:var(--unit);min-height:40px}
.cap .no{flex:0 0 auto;font-size:11.5px;padding:1px 8px;border:1px solid var(--line);
 border-radius:20px;color:var(--ink2);font-family:ui-monospace,monospace}
/* 基态就是可见 —— 动画只负责滑入。动画没跑文字仍看得见（抽帧时抓到过 opacity:0） */
.cap .tx{font-size:13px;line-height:1.6;opacity:.95;animation:fade .45s ease-out;max-width:66ch}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:.95;transform:none}}

/* ── 通用积木：代码片 / 强调 ── */
.k{font-family:ui-monospace,monospace;font-size:11.5px;border:1px solid var(--line);
 border-radius:4px;padding:1px 5px;white-space:nowrap}
.hi{color:var(--b1);font-weight:600;font-style:normal}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.lane{display:flex;align-items:center;margin-bottom:calc(var(--unit)*2)}
/* 泳道标签横排 —— 竖排是排版下策（doc-design-principles） */
.lbl{flex:0 0 52px;font-size:12px;letter-spacing:.1em;color:var(--ink2);font-weight:600;
 border-left:2px solid var(--line);padding-left:9px;line-height:1.35}
.card{flex:1;min-width:0;height:56px;border:1px solid var(--line);border-radius:7px;
 padding:8px 11px;display:flex;flex-direction:column;justify-content:center;position:relative;
 transition:border-color .45s,transform .45s}
.card b{font-size:14px;font-weight:600;color:var(--ink2);transition:color .45s;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card i{font-style:normal;font-size:12px;opacity:.78;margin-top:2px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.q{border-radius:7px 18px 7px 18px}
.ar{flex:0 0 34px;text-align:center;color:var(--line);font-size:15px}
/* 高亮只换描边与字色 + 极轻位移，不用实心填充（白底黑底都成立） */
.card.on{border-color:var(--b2);transform:translateY(-2px)}
.card.on b{color:var(--b1)}
.card.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;
 border-radius:2px;background:linear-gradient(90deg,var(--b1),var(--b2),var(--b3));
 animation:grow .45s ease-out}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.merge{display:flex;align-items:center}
.merge .lbl{visibility:hidden}
.merge .tail{flex:1;height:1px;background:var(--line);margin:0 12px}
.merge .card{flex:0 0 452px}
</style>
</head>
<body>
<div id="stage">
  <div class="hd"><h1>请假与补卡 · 流程总览</h1><div class="sub">两条线各走各的，最后都汇到「次日看结果」—— 那一步才算闭环。</div></div>
  <div class="bar" id="bar"></div>
  <div class="lane"><div class="lbl">请假</div>
    <div class="card"><b data-fit>1 选假种提单</b><i>Lark › 审批 › 请假</i></div>
    <div class="ar">▸</div>
    <div class="card"><b data-fit>2 等审批结果</b><i>审批消息通知</i></div>
    <div class="ar">▸</div>
    <div class="card q"><b data-fit>3 审批通过？</b><i>否 → 改提事假或补材料</i></div>
  </div>
  <div class="lane"><div class="lbl">补卡</div>
    <div class="card"><b data-fit>4 发现忘打卡</b><i>个人考勤页看到缺卡</i></div>
    <div class="ar">▸</div>
    <div class="card"><b data-fit>5 三日内补卡</b><i>Lark › 考勤 › 补卡</i></div>
    <div class="ar">▸</div>
    <div class="card q"><b data-fit>6 还在窗口？</b><i>否 → 记缺卡，无法补救</i></div>
  </div>
  <div class="merge"><div class="lbl">·</div><div class="tail"></div>
    <div class="card"><b data-fit>7 次日看结果</b><i>请假通过＝不算缺勤　补卡通过＝自动修正</i></div>
    <div class="tail"></div></div>
  <div class="cap"><span class="no" id="cn"></span><span class="tx" id="ct"></span></div>
</div>
<script>
var TABS = ["1 提单","2 等审批","3 判定","4 发现缺卡","5 补卡","6 窗口","7 看结果"];

var __cur = -1, __auto = true, __timer = null;
var bar = document.getElementById("bar");
var __tabs = TABS.map(function (t, i) {
  return (typeof t === "string") ? { l: t, s: i } : { l: t.l, s: t.s };
});
// ⚠ 必须在 boot() 里赋值：SHELL_JS 排在页面脚本**之前**，
//   这里直接取 window.STEPS_N 会永远拿不到，底部序号会显示成「1 / 标签数」。
var TOTAL = __tabs.length;

function setCap(n, total, html) {
  document.getElementById("cn").textContent = (n + 1) + " / " + total;
  var t = document.getElementById("ct");
  t.innerHTML = html;
  t.style.animation = "none"; void t.offsetWidth; t.style.animation = "";
}
function __tick() { apply((__cur + 1) % TOTAL); }
function setAuto(v) {
  __auto = v; clearInterval(__timer);
  if (__auto) __timer = setInterval(__tick, (window.STEP_MS || 3200));
  document.getElementById("pp").textContent = __auto ? "⏸" : "▶";
}
// 标签落在「起点 ≤ 当前步」的最后一个上 —— 一步一标签时等价于精确匹配
function __markTabs(n) {
  var hit = 0;
  __tabs.forEach(function (t, i) { if (t.s <= n) hit = i; });
  [].slice.call(bar.querySelectorAll(".pill[data-s]")).forEach(function (p, i) {
    p.classList.toggle("on", i === hit);
  });
}
// 页面内「每一步」的可点元素统一走这里：切到那一步并暂停
function goto(n) { setAuto(false); apply(n); }
function boot() {
  TOTAL = window.STEPS_N || __tabs.length;
  bar.innerHTML = '<span class="pill play" id="pp" tabindex="0" role="button" aria-label="播放或暂停">⏸</span>' +
    __tabs.map(function (t) {
      return '<span class="pill" tabindex="0" role="button" data-s="' + t.s + '">' + t.l + "</span>";
    }).join("");
  // 点任意流程标签 → 切到那一步并**暂停**；播放键单独控制自动
  bar.addEventListener("click", function (e) {
    var p = e.target.closest(".pill"); if (!p) return;
    if (p.id === "pp") { setAuto(!__auto); return; }
    setAuto(false); apply(+p.dataset.s);
  });
  bar.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault(); e.target.click();
  });
  apply(0); setAuto(true); fit();
}

// 等比缩放到设计基准；transform 不改布局高度，必须写回 body
var __stage = document.getElementById("stage");
function fit() {
  var s = Math.min(1, document.documentElement.clientWidth / 820);
  __stage.style.transform = s < 1 ? "scale(" + s + ")" : "none";
  document.body.style.height = Math.ceil(__stage.offsetHeight * s) + "px";
}
addEventListener("resize", fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.body);
setInterval(fit, 1200);   // 某些宿主改 iframe 尺寸不派发 resize，心跳兜底

// 文本宽度检验：宽度是准则，字号是结果
window.__fit = [];
setTimeout(function () {
  [].slice.call(document.querySelectorAll("[data-fit]")).forEach(function (el) {
    var lim = 764 * 0.9;
    window.__fit.push({ t: el.textContent.slice(0, 24), w: el.scrollWidth, fit: el.scrollWidth <= lim });
  });
}, 600);

// ── 版面美学自检 ──（张博 2026-08-31：规范要含页面美学审核、空间利用效率、对齐、留白）
// 这四类判据**只有渲染后才测得出来** —— 静态 lint 看不出「右侧空了一块」。
// 出图前在浏览器里读 window.__audit()；不合格的项会同时打进 console。
window.__audit = function () {
  var G = 28, INNER = 764;
  var sr = __stage.getBoundingClientRect();
  var all = [].slice.call(__stage.querySelectorAll("*")).filter(function (e) {
    var r = e.getBoundingClientRect();
    return r.width > 0 && r.height > 0 && getComputedStyle(e).visibility !== "hidden";
  });
  var minL = 1e9, maxR = -1e9, maxB = -1e9;
  all.forEach(function (e) {
    var r = e.getBoundingClientRect();
    if (r.left < minL) minL = r.left;
    if (r.right > maxR) maxR = r.right;
    if (r.bottom > maxB) maxB = r.bottom;
  });
  // 直接子块的左基线：同层级必须落在同一条线上
  var lefts = [].slice.call(__stage.children).map(function (e) {
    return Math.round(e.getBoundingClientRect().left - sr.left);
  });
  var uniq = lefts.filter(function (v, i, a) { return a.indexOf(v) === i; });

  var A = {
    padL: Math.round(minL - sr.left),          // 左留白（实测）
    padR: Math.round(sr.right - maxR),         // 右留白（实测）
    slackR: Math.round(sr.right - G - maxR),   // 右侧「空了一块」的量
    lefts: uniq,
    fill: +(((maxR - minL) / INNER) * 100).toFixed(1) + "%",
    issues: [],
  };
  if (A.padL < G - 1 || A.padR < G - 1) A.issues.push("贴边：实测左 " + A.padL + " 右 " + A.padR + "，应 ≥ " + G);
  if (A.slackR > 80) A.issues.push("右侧空白过大：" + A.slackR + "px（阈值 80）—— 要么加内容，要么收窄容器");
  if (uniq.length > 2) A.issues.push("左基线不齐：直接子块出现 " + uniq.length + " 个左边界 " + uniq.join("/"));
  if (A.issues.length) console.warn("【版面美学】" + A.issues.join("；"));
  return A;
};
setTimeout(window.__audit, 700);


window.STEP_MS = 2800;
var TXT = ["选 病假 <span class=\"hi\">Sakit</span> 或 事假 <span class=\"hi\">Izin</span>，填起止时间和事由。病假必须附医生证明 —— 没证明只能走事假（无薪）。","提前 1 天提；审批人处理后有消息通知。超过 1 天没动静，在群里催一下。","没通过就改提事假或补齐材料，<span class=\"hi\">别放着不管</span> —— 当天会按缺勤记。","忘打卡当天就能在个人考勤页看到缺卡标记，别等月底。","选日期、选班次、写原因，三步提交。补卡窗口只有 <span class=\"hi\">3 天</span>。","过了 3 天窗口谁都补不了，当天按缺卡计入考勤 —— 下次当天就补。","请假通过＝不算缺勤；补卡通过＝考勤自动修正。次日复核一遍，不对再找 HR。"];
var cards = [].slice.call(document.querySelectorAll(".card"));
function apply(n) {
  __cur = n; __markTabs(n);
  cards.forEach(function (c, i) { c.classList.toggle("on", i === n); });
  setCap(n, TXT.length, TXT[n]);
}
boot();
</script>
</body>
</html>
