<script>
var __I18N = {"id":{"title":"Empat Approval Keuangan","sub":"Sama seperti halaman desain alur di admin Approval Lark. Tab atas ganti approval; klik node untuk lihat siapa, apa, dan batas waktunya.","tabs":[{"l":"Pembelian","s":0},{"l":"Pembayaran","s":6},{"l":"Pinjaman","s":14},{"l":"Klaim","s":19}]}};

window.__LANG = __LANG;

var __cur = -1, __auto = true, __timer = null;
var bar = document.getElementById("bar");
var __tabs = TABS.map(function (t, i) {

});
// ⚠ 必须在 boot() 里赋值：SHELL_JS 排在页面脚本**之前**，

var TOTAL = __tabs.length;

}
function __tick() { apply((__cur + 1) % TOTAL); }
function setAuto(v) {
  __auto = v; clearInterval(__timer);
  if (__auto) __timer = setInterval(__tick, (window.STEP_MS || 3200));

}
// 标签落在「起点 ≤ 当前步」的最后一个上 —— 一步一标签时等价于精确匹配
function __markTabs(n) {
  var hit = 0;
  __tabs.forEach(function (t, i) { if (t.s <= n) hit = i; });
  [].slice.call(bar.querySelectorAll(".pill[data-s]")).forEach(function (p, i) {

// 这四类判据**只有渲染后才测得出来** —— 静态 lint 看不出「右侧空了一块」。
// 出图前在浏览器里读 window.__audit()；不合格的项会同时打进 console。
window.__audit = function () {
  var G = 28, INNER = 764;
  var sr = __stage.getBoundingClientRect();
  var all = [].slice.call(__stage.querySelectorAll("*")).filter(function (e) {
    var r = e.getBoundingClientRect();
    return r.width > 0 && r.height > 0 && getComputedStyle(e).visibility !== "hidden";
  });
  var minL = 1e9, maxR = -1e9, maxB = -1e9;
  all.forEach(function (e) {
    var r = e.getBoundingClientRect();
    if (r.left < minL) minL = r.left;
    if (r.right > maxR) maxR = r.right;
    if (r.bottom > maxB) maxB = r.bottom;
  });

  var lefts = [].slice.call(__stage.children).map(function (e) {

  });

  var A = {
    padL: Math.round(minL - sr.left),          // 左留白（实测）
    padR: Math.round(sr.right - maxR),         // 右留白（实测）
    slackR: Math.round(sr.right - G - maxR),   // 右侧「空了一块」的量
    lefts: uniq,
    fill: +(((maxR - minL) / INNER) * 100).toFixed(1) + "%",
    issues: [],
  };
  if (A.padL < G - 1 || A.padR < G - 1) A.issues.push("贴边：实测左 " + A.padL + " 右 " + A.padR + "，应 ≥ " + G);

  if (uniq.length > 2) A.issues.push("左基线不齐：直接子块出现 " + uniq.length + " 个左边界 " + uniq.join("/"));
  if (A.issues.length) console.warn("【版面美学】" + A.issues.join("；"));
  return A;
};
