</div><script>
var COLS=[{"f":"EXID","n":"EXID","w":96},{"f":"c34464","n":"备注","w":96},{"f":"JobCN","n":"Job-CN","w":62},{"f":"Score","n":"Score","w":58},{"f":"Status","n":"Status","w":84},{"f":"Time","n":"Time","w":54},{"f":"LIMIT","n":"LIMIT","w":58},{"f":"Valid","n":"Valid","w":76}];
var STEPS=[{cap:"成绩、档位、用时全是<b>公式自动算</b>的 —— 你只看两列：<b>Status</b> 和 <b>Valid</b>",sub:"Base2 › A07_考核 EXAM › EXAM.T2-ALL",cells:{},focus:[]}].concat([{"cap":"① 看 Status 档位","sub":"🌕BEST ≥85 · 🌖GOOD ≥70 · 🌗PASS ≥50 · 🌘WEAK <50。四档由 Score 自动判，不用手填","act":"Status","focus":["c34464","Score","Status"],"done":0,"note":0,"cells":{}},{"cap":"② 看 Valid 有没有超时","sub":"Time 超过 LIMIT 就是超时。LIMIT = 题数（每题 1 分钟），全卷 20 题就是 20 分钟","act":"Valid","focus":["c34464","Time","Valid"],"done":0,"note":0,"cells":{}},{"cap":"③ EXID 前四位就是卷号","sub":"LH=主播 · MC=主持 · HM=妆造 —— 一岗一卷共 12 张，发错卷这里一眼看得出来","act":"EXID","focus":["EXID","JobCN"],"done":0,"note":0,"cells":{}},{"cap":"④ 成绩自动进总评，不用你搬","sub":"自动化把 A07 挂进 A09_总评，按 Score÷100×25 折成 EX-S，占总分的四分之一","act":"Score","focus":["c34464","Score","Status"],"done":0,"note":0,"cells":{}}]);
var BASE={"EXID":"LH1H0062","c34464":"Dewi Anggraini","JobCN":"主播","Score":"54","Status":"<span class=\"chip warn\">🌗 PASS</span>","Time":"26","LIMIT":"20","Valid":"<span class=\"chip warn\">⚠️ 超时</span>"};
var SEED=[{"EXID":"LH1H0061","备注":"Intan Permata Putri","Job-CN":"主播","Score":"88","Status":"<span class=\"chip\">🌕 BEST</span>","Time":"17","LIMIT":"20","Valid":"<span class=\"chip\">✅ 有效</span>"},{"EXID":"MC1H0012","备注":"Rizky Fajar Ramadhanya","Job-CN":"主持","Score":"73","Status":"<span class=\"chip\">🌖 GOOD</span>","Time":"19","LIMIT":"20","Valid":"<span class=\"chip\">✅ 有效</span>"},{"EXID":"LH1H0062","备注":"Dewi Anggraini","Job-CN":"主播","Score":"54","Status":"<span class=\"chip warn\">🌗 PASS</span>","Time":"26","LIMIT":"20","Valid":"<span class=\"chip warn\">⚠️ 超时</span>"},{"EXID":"HM1H0008","备注":"Eko Prasetyo","Job-CN":"妆造","Score":"41","Status":"<span class=\"chip bad\">🌘 WEAK</span>","Time":"12","LIMIT":"20","Valid":"<span class=\"chip\">✅ 有效</span>"}];
var cur=0,auto=true,timer=null;
function S(i){return document.getElementById(i)}
function cell(col,row){var r=SEED[row%SEED.length]||{};return r[col.n]!==undefined?r[col.n]:""}
function seedRow(no,ri){
 // 属性一律加引号：属性值一旦含特殊字符（或为空），无引号会被解析成隔壁属性（2026-08-30 实测过）
 var tds=COLS.map(function(c){return '<div class="td" data-col="'+c.f+'" style="width:'+c.w+'px">'+cell(c,ri)+"</div>"});
 return '<div class="rrow"><div class="rn"><span class="cb"></span>'+no+"</div>"+tds.join("")+"</div>"}
var DW=820, scale=1;
function layout(){
 // ① 整体等比缩放到容器宽度（820 = 设计基准 = 飞书正文封顶宽）
 var cw=document.documentElement.clientWidth||window.innerWidth;
 scale=Math.min(1,cw/DW);
 var wrap=document.querySelector(".wrap");
 wrap.style.transform=scale<1?"scale("+scale+")":"none";
 // ② 行数在「设计坐标系」里算：容器实高换算回设计像素，再按 24px 行高排
 var dh=window.innerHeight/scale;
 var gridTop=document.querySelector(".grid").offsetTop;   // offsetTop 不受 transform 影响，本就是设计像素
 var noteH=S("note").offsetHeight+9;
 var n=Math.max(0,Math.floor((dh-gridTop-noteH-8)/24)-4);
 n=Math.min(n,40);
 var h="";for(var i=0;i<n;i++)h+=seedRow(15+i,i);
 S("ctx").innerHTML=h;
 S("rnA").textContent=15+n;S("rnB").textContent=16+n;
}
function apply(n){
 cur=n;
 document.querySelectorAll(".td[id]").forEach(function(e){e.innerHTML="";e.classList.remove("act")});
 for(var k in BASE){var e=S("a_"+k);if(e)e.innerHTML=BASE[k]}
 var merged={},done=0,note=0;
 for(var i=0;i<=n;i++){var st=STEPS[i];for(var c in st.cells)merged[c]=st.cells[c];
  done=st.done||done;note=st.note||note}
 for(var c2 in merged){var e2=S("b_"+c2);if(e2)e2.innerHTML=merged[c2]}
 var act=STEPS[n].act;
 if(act&&S("b_"+act))S("b_"+act).classList.add("act");
 // 横向滚动把整组关注列带进视野。⚠ 锚点必须取「物理最靠右」的列，
 // 不能取 focus 数组的最后一项 —— 配置里的书写顺序不等于列在表里的顺序（2026-08-30 实测踩到）
 var ml=0,maxR=-1;
 (STEPS[n].focus||[]).concat(act?[act]:[]).forEach(function(f){
  var e=S("b_"+f);if(e){var r=e.offsetLeft+e.offsetWidth;if(r>maxR)maxR=r}});
 if(maxR>0){var gw=document.querySelector(".grid").clientWidth;
  ml=-Math.max(0,maxR+10-gw)}
 S("gwrap").style.marginLeft=ml+"px";
 S("r1").className="rrow"+(done?" done":"");
 S("note").className="note"+(note?" show":"");
 S("cap").innerHTML=STEPS[n].cap;S("sub").textContent=STEPS[n].sub;
 document.querySelectorAll(".pill[data-s]").forEach(function(p){
  p.className="pill"+(+p.dataset.s===n?" on":"")});
}
function tick(){apply((cur+1)%STEPS.length)}
function setAuto(v){auto=v;clearInterval(timer);if(auto)timer=setInterval(tick,2600);
 S("pp").textContent=auto?"⏸":"▶"}
document.querySelectorAll(".pill[data-s]").forEach(function(p){
 p.onclick=function(){setAuto(false);apply(+p.dataset.s)}});
S("pp").onclick=function(){setAuto(!auto)};
// 尺寸自适应三重保险：resize 事件 / ResizeObserver / 心跳兜底
//   （iframe 内某些宿主改尺寸不派发 resize 事件，实测过 —— 只靠事件会漏）
var rto,lastW=0,lastH=0;
function relayout(){clearTimeout(rto);rto=setTimeout(function(){layout();apply(cur)},160)}
window.addEventListener("resize",relayout);
if(window.ResizeObserver)try{new ResizeObserver(relayout).observe(document.documentElement)}catch(e){}
// 高度广播（宿主若支持自动适配就白赚；飞书实测不监听，无害）
function beat(){
 if(window.innerWidth!==lastW||window.innerHeight!==lastH){
  lastW=window.innerWidth;lastH=window.innerHeight;layout();apply(cur)}
 // 广播的是缩放后的实际高度（getBoundingClientRect 已含 transform）
 var h=Math.ceil(document.querySelector(".wrap").getBoundingClientRect().height)+8;
 try{parent.postMessage({type:"resize",height:h,src:"muke-demo"},"*")}catch(e){}}
layout();apply(0);setAuto(true);lastW=window.innerWidth;lastH=window.innerHeight;
setTimeout(beat,300);setInterval(beat,1200);
</script></body></html>
