<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="color-scheme" content="dark">
<title>MUKE · Lanjut</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Noto+Sans+SC:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#0b0b0f;--sf:#15151c;--sf2:#1d1d27;--ln:#2a2a36;--tx:#f2f2f5;--dim:#9b9baa;--pk:#ff2d78;--gr:#33d69f;--am:#ffb020;
--f:'Archivo','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;--m:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:400 16px/1.6 var(--f);-webkit-font-smoothing:antialiased}
html[lang="zh"] body{font-family:'Noto Sans SC','Archivo',system-ui,'Microsoft YaHei',sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 60px}
header{position:sticky;top:0;z-index:9;background:rgba(11,11,15,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;padding-bottom:0}
.logo{font-weight:800;letter-spacing:.14em;font-size:19px;font-family:'Archivo',sans-serif}.logo i{color:var(--pk);font-style:normal}
.lang{display:flex;border:1px solid var(--ln);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:var(--dim);font:600 12px var(--f);padding:8px 14px;cursor:pointer;min-height:34px}
.lang button.on{background:var(--pk);color:#fff}
.demo{background:#241a06;border:1px solid #5c4a16;color:#ffd570;border-radius:12px;padding:12px 14px;font-size:13px;margin:16px 0;line-height:1.5}
.demo b{display:block;margin-bottom:4px}
.demo code{font:500 12px var(--m);background:#00000040;border-radius:6px;padding:1px 6px;cursor:pointer}
h1{font-size:clamp(26px,6.5vw,34px);font-weight:800;line-height:1.15;letter-spacing:-.02em;margin:26px 0 8px}
h1 em{color:var(--pk);font-style:normal}
.sub{color:var(--dim);font-size:15px;max-width:46ch}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:20px;margin-top:20px}
label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
input{width:100%;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;color:var(--tx);
font:500 17px var(--m);padding:13px 15px;outline:none;min-height:48px}
input:focus{border-color:var(--pk)}
.btn{display:block;width:100%;margin-top:18px;background:var(--pk);color:#fff;border:0;border-radius:12px;
font:600 16px var(--f);padding:15px;cursor:pointer;text-align:center;text-decoration:none;min-height:50px;transition:.15s}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:none;border:1px solid var(--ln);color:var(--tx)}
.btn.ghost:hover{border-color:var(--pk)}
.err{background:#2a1520;border:1px solid #5c2338;color:#ffb3cc;border-radius:12px;padding:13px;font-size:14px;margin-top:14px}
.rail{display:flex;gap:0;margin:22px 0 6px}
.rst{flex:1;text-align:center;position:relative;font-size:12px;color:var(--dim);padding-top:30px}
.rst::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:99px;
background:var(--sf2);border:2px solid var(--ln)}
.rst::after{content:"";position:absolute;top:20px;left:calc(50% + 13px);right:calc(-50% + 13px);height:2px;background:var(--ln)}
.rst:last-child::after{display:none}
.rst.done{color:var(--gr)}.rst.done::before{background:var(--gr);border-color:var(--gr);content:"";box-shadow:inset 0 0 0 4px #0e2a20}
.rst.now{color:var(--tx);font-weight:600}.rst.now::before{border-color:var(--pk);box-shadow:0 0 0 4px #ff2d7822}
.who{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.who b{font-size:20px}.who span{font:500 13px var(--m);color:var(--dim)}
.note{font-size:13px;color:var(--dim);margin-top:12px;line-height:1.55}
.shimmer{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--sf2) 25%,var(--ln) 50%,var(--sf2) 75%);
background-size:200% 100%;animation:sh 1.1s infinite}
@keyframes sh{to{background-position:-200% 0}}
.stage-msg{font-size:14px;color:var(--dim);margin-top:14px;min-height:22px}
.choice{display:block;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-top:10px;cursor:pointer;transition:.15s}
.choice:hover{border-color:var(--pk)}
.choice b{display:block}.choice span{font-size:13px;color:var(--dim)}
footer{color:var(--dim);font-size:12px;margin-top:36px;opacity:.7}
</style></head><body>
<header><div class="wrap"><div class="logo">MUKE<i>&#9679;</i></div>
<div class="lang"><button id="lid" class="on">ID</button><button id="lzh">中</button></div></div></header>
<div class="wrap">

<div class="demo" id="demoBox"></div>

<div id="stepAsk">
<h1 data-t="h1"></h1>
<p class="sub" data-t="sub"></p>
<div class="card">
<label data-t="l_wa"></label>
<input id="wa" type="tel" inputmode="numeric" autocomplete="tel" placeholder="0812 3456 7890">
<label data-t="l_dob"></label>
<input id="dob" type="tel" inputmode="numeric" placeholder="DDMMYYYY · 05082003" maxlength="8">
<button class="btn" id="go" data-t="b_go"></button>
<div id="askErr"></div>
<div class="note" data-t="privacy"></div>
</div>
</div>

<div id="stepLoad" hidden>
<h1 data-t="h_check"></h1>
<div class="card">
<div class="shimmer" style="width:55%"></div>
<div class="shimmer" style="width:80%;margin-top:12px"></div>
<div class="shimmer" style="width:40%;margin-top:12px"></div>
<div class="stage-msg" id="stageMsg"></div>
</div>
</div>

<div id="stepResult" hidden></div>

<footer>MUKE MEDIA Indonesia · <span data-t="f_note"></span></footer>
</div>
<script>
/* ============================================================
   /lanjut/ · 候选人续办页 —— DEMO 原型（2026-08-31）
   正式版差异：queryCandidate() 改调后端（查 A05/A06/A07 by WA9），
   demo 版用下面的假数据模拟五种状态。数据永远落回 Lark 表单。
   ============================================================ */
var DEMO=true;
// 演示档案：五个号码五种剧本。生日统一 05082003（防乱查的第二因子）。
// 键 = 号码的 wa9（剥符号取右 9 位），与 Base 公式同款 —— 两边一套规则
var NUMS=["08111000001","08122000002","08133000003","08144000004","08155000005"];  // guard-tree:allow phone-id 虚构演示号，本地真实数据零命中（081x x000000N 顺序编造）
var FAKE={
 "111000001":{name:"Siti Rahayu",  job:"妆造",  jobId:"Penata Rias", stage:1, agent:"Fitri"},   // 简历完成 → 背调
 "122000002":{name:"Budi Santoso", job:"主播",  jobId:"Host Live",   stage:2, agent:"Fitri"},   // 背调完成 → 笔试
 "133000003":{name:"Ayu Lestari",  job:"财务",  jobId:"Keuangan",    stage:3, agent:"Junita"},  // 笔试完成 → 等面试
 "144000004":{name:"Dewi Anggraini",job:"",     jobId:"",            stage:-2,agent:"Rai",      // 跨岗位重投 → 选择
   multi:[{job:"主播",jobId:"Host Live",stage:1},{job:"妆造",jobId:"Penata Rias",stage:0}]},
 "155000005":{name:"Rizky Pratama",job:"主播",  jobId:"Host Live",   stage:-1,agent:"Dilla"}    // 💼已在职 → 拦截
};
var DOB_OK="05082003";
// 真实表单（预填演示用 Ref=DEMO，绝不污染真实归因；hide 三件套演示零重填）
var FORMS={
 "背调_妆造":"https://mukestar.jp.larksuite.com/share/base/form/shrjpQmzeHYCl9o9rMtJX4ejwBg",
 "笔试_主播":"https://mukestar.jp.larksuite.com/share/base/form/shrjpkb4VsiHfvjTcMoROA7kNSd"};

var L={
id:{h1:'Lanjutkan <em>lamaranmu</em>',
 sub:'Masukkan nomor WhatsApp yang kamu pakai saat melamar. Kami tunjukkan langkah berikutnya — tanpa isi ulang data.',
 l_wa:'Nomor WhatsApp', l_dob:'Tanggal lahir (TTBBTTTT)', b_go:'Lanjut →',
 privacy:'🔒 Nomor + tanggal lahir hanya untuk verifikasi. Tidak ada data yang tampil ke orang lain.',
 h_check:'Sebentar ya…',
 checking:['Mencari datamu…','Ketemu! Menyiapkan langkah berikutnya…'],
 e_notfound:'Nomor tidak ditemukan. Cek lagi nomormu, atau mulai lamaran baru lewat link agen kamu.',
 e_dob:'Tanggal lahir tidak cocok. Format: TTBBTTTT, contoh 05082003.',
 e_empty:'Isi nomor WhatsApp dan tanggal lahir dulu ya.',
 rail:['Lamaran','Kuesioner','Tes tulis','Interview'],
 hi:function(n){return 'Halo, '+n+'!';},
 stat1:'Lamaranmu sudah masuk. Langkah berikutnya: kuesioner posisi.',
 stat2:'Kuesioner selesai. Langkah berikutnya: tes tulis. Ada batas waktu — kerjakan saat kamu siap.',
 stat3:'Semua tes selesai! 🎉 Tim kami akan hubungi kamu lewat WhatsApp untuk jadwal interview. Tidak perlu melakukan apa-apa lagi.',
 statX:'Data kamu perlu dicek manual. Hubungi agen kamu ya:',
 b_next1:'Isi kuesioner →', b_next2:'Mulai tes tulis →',
 multi:'Kamu punya 2 lamaran. Mau lanjut yang mana?',
 mstage:['baru masuk','kuesioner selesai'],
 prefil:'✨ Nama, nomor WA & kode sudah terisi otomatis — kamu tinggal jawab pertanyaannya.',
 fallback:'Koneksi lambat? Buka form langsung (isi manual):',
 f_note:'Halaman DEMO — data contoh, bukan data asli.',
 demo:'<b>🧪 MODE DEMO — nomor uji (lahir semua 05082003):</b>'},
zh:{h1:'继续你的<em>应聘</em>',
 sub:'输入你报名时用的 WhatsApp 号码，我们直接带你到下一步 —— 不用重填任何资料。',
 l_wa:'WhatsApp 号码', l_dob:'出生日期（日月年8位）', b_go:'继续 →',
 privacy:'🔒 号码+生日仅用于核对身份，不会向任何人展示你的资料。',
 h_check:'稍等…',
 checking:['正在核对你的资料…','找到了！正在准备下一步…'],
 e_notfound:'没有找到这个号码。请核对号码，或通过你的经纪人链接重新报名。',
 e_dob:'出生日期不匹配。格式：日月年 8 位，如 05082003。',
 e_empty:'请先填写号码和出生日期。',
 rail:['报名','问卷','笔试','面试'],
 hi:function(n){return '你好，'+n+'！'},
 stat1:'报名已收到。下一步：岗位问卷。',
 stat2:'问卷已完成。下一步：笔试。有时间限制 —— 准备好了再开始。',
 stat3:'全部测试已完成！🎉 我们会通过 WhatsApp 联系你安排面试，你不需要再做任何事。',
 statX:'你的资料需要人工核对，请联系你的经纪人：',
 b_next1:'填写问卷 →', b_next2:'开始笔试 →',
 multi:'你有 2 份应聘记录，要继续哪一份？',
 mstage:['刚提交','问卷已完成'],
 prefil:'✨ 姓名、号码和归因码已自动填好并隐藏 —— 你只需要答题。',
 fallback:'加载太慢？直接打开表单（手动填写）：',
 f_note:'DEMO 演示页 —— 示例数据，非真实数据。',
 demo:'<b>🧪 演示模式 — 测试号码（生日都是 05082003）：</b>'}};
var LANG='id';try{var sv=localStorage.getItem('muke_lang');if(sv==='zh'||sv==='id')LANG=sv;}catch(e){}
function t(k){return L[LANG][k];}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
// 与 Base 公式同款的号码归一：剥符号取右 9 位（两边必须一套规则，否则查不到）
function wa9(s){return String(s).replace(/[+\s\-().]/g,'').replace(/\D/g,'').slice(-9);}

function applyLang(){
 document.documentElement.lang=LANG==='zh'?'zh':'id';
 document.getElementById('lid').className=LANG==='id'?'on':'';
 document.getElementById('lzh').className=LANG==='zh'?'on':'';
 Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(el){el.innerHTML=t(el.getAttribute('data-t'));});
 paintDemo();}
document.getElementById('lid').onclick=function(){LANG='id';try{localStorage.setItem('muke_lang','id')}catch(e){};applyLang();};
document.getElementById('lzh').onclick=function(){LANG='zh';try{localStorage.setItem('muke_lang','zh')}catch(e){};applyLang();};

function paintDemo(){
 var lab=['①→问卷/kuesioner','②→笔试/tes','③等面试/interview','④双记录/2 lamaran','⑤在职拦截/blokir'];
 document.getElementById('demoBox').innerHTML=t('demo')+NUMS.map(function(n,i){
  return '<code onclick="fill(\''+n+'\')">'+n+'</code> '+lab[i];}).join('　');}
function fill(n){document.getElementById('wa').value=n;document.getElementById('dob').value=DOB_OK;}

// —— 查询（demo：假数据 + 人工延迟；正式版换成 fetch 后端）——
function queryCandidate(w9){return new Promise(function(res){setTimeout(function(){res(FAKE[w9]||null);},1400);});}

function rail(stage){ // stage: 0..3 已完成到哪步（-1 拦截不画）
 return '<div class="rail">'+t('rail').map(function(n,i){
  var c=i<stage?'done':(i===stage?'now':'');
  return '<div class="rst '+c+'">'+esc(n)+'</div>';}).join('')+'</div>';}

function formUrl(base,p){var q=Object.keys(p).map(function(k){return 'prefill_'+encodeURIComponent(k)+'='+encodeURIComponent(p[k])+'&hide_'+encodeURIComponent(k)+'=1';}).join('&');
 return base+(base.indexOf('?')>0?'&':'?')+q;}

function show(id){['stepAsk','stepLoad','stepResult'].forEach(function(x){document.getElementById(x).hidden=(x!==id);});}

function renderResult(c,waFull){
 var el=document.getElementById('stepResult'),h='';
 if(c.stage===-1){ // 💼在职/需人工 —— A05.Check 拦截档在页面的对应物
  h='<h1>'+t('hi')(esc(c.name))+'</h1><div class="card"><div class="err">'+t('statX')+' <b>'+esc(c.agent)+'</b></div></div>';
 }else if(c.stage===-2){ // 跨岗位双记录 —— 只有真跨岗位才问
  h='<h1>'+t('hi')(esc(c.name))+'</h1><div class="card"><p>'+t('multi')+'</p>'+
   c.multi.map(function(m,i){return '<div class="choice" onclick="pick('+i+')"><b>'+esc(LANG==='zh'?m.job:m.jobId)+'</b><span>'+t('mstage')[m.stage===0?0:1]+'</span></div>';}).join('')+'</div>';
 }else{
  var acts='';
  if(c.stage===1){ // → 背调（真表单 · 三件套预填演示）
   var u=formUrl(FORMS['背调_妆造'],{'Ref':'DEMO','Full Name':c.name,'WhatsApp':waFull});
   acts='<a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">'+t('b_next1')+'</a><div class="note">'+t('prefil')+'</div>';
  }else if(c.stage===2){ // → 笔试（真表单 · 号码预填）
   var u2=formUrl(FORMS['笔试_主播'],{'WhatsApp/Phone':waFull});
   acts='<a class="btn" href="'+esc(u2)+'" target="_blank" rel="noopener">'+t('b_next2')+'</a><div class="note">'+t('prefil')+'</div>';
  }
  h='<h1>'+t('hi')(esc(c.name))+'</h1>'+
   '<div class="card"><div class="who"><b>'+esc(LANG==='zh'?c.job:c.jobId)+'</b><span>'+esc(c.agent)+'</span></div>'+
   rail(c.stage)+'<p class="note">'+t('stat'+c.stage)+'</p>'+acts+'</div>';
 }
 el.innerHTML=h;show('stepResult');
}
var CUR=null,WAF='';
function pick(i){var m=CUR.multi[i];renderResult({name:CUR.name,job:m.job,jobId:m.jobId,stage:m.stage+1,agent:CUR.agent},WAF);}

document.getElementById('go').onclick=function(){
 var w=document.getElementById('wa').value,d=document.getElementById('dob').value.replace(/\D/g,'');
 var eb=document.getElementById('askErr');eb.innerHTML='';
 if(!w||!d){eb.innerHTML='<div class="err">'+t('e_empty')+'</div>';return;}
 if(d!==DOB_OK&&DEMO){eb.innerHTML='<div class="err">'+t('e_dob')+'</div>';return;}
 var w9=wa9(w);WAF=w;
 try{localStorage.setItem('muke_wa',w);}catch(e){}
 show('stepLoad');
 var msgs=t('checking'),mi=0,me=document.getElementById('stageMsg');me.textContent=msgs[0];
 var tick=setInterval(function(){mi++;if(mi<msgs.length)me.textContent=msgs[mi];},900);
 // 🔥 保险丝：2.5s 无论查询是否返回，必须给出可走的路（教训：内容可见性不能依赖异步跑完）
 var done=false;
 var fuse=setTimeout(function(){if(done)return;done=true;clearInterval(tick);fallback();},2500);
 queryCandidate(w9).then(function(c){
  if(done)return;done=true;clearTimeout(fuse);clearInterval(tick);
  if(!c){show('stepAsk');eb.innerHTML='<div class="err">'+t('e_notfound')+'</div>';return;}
  CUR=c;renderResult(c,w);
 });
};
function fallback(){ // 降级：裸链接照样能走完流程，只是要手填
 var el=document.getElementById('stepResult');
 el.innerHTML='<div class="card"><p class="note">'+t('fallback')+'</p>'+
  '<a class="btn ghost" href="'+FORMS['背调_妆造']+'" target="_blank" rel="noopener">Kuesioner · 问卷</a>'+
  '<a class="btn ghost" href="'+FORMS['笔试_主播']+'" target="_blank" rel="noopener">Tes tulis · 笔试</a></div>';
 show('stepResult');}

// 同浏览器回访：号码免输（正式版核心体验；demo 也演示）
try{var last=localStorage.getItem('muke_wa');if(last)document.getElementById('wa').value=last;}catch(e){}
applyLang();
</script></body></html>
